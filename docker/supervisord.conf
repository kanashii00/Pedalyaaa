[supervisord]
nodaemon=true
user=root
logfile=/dev/null
pidfile=/tmp/pedalya-supervisord.pid

[program:apache]
command=apache2-foreground
autostart=true
autorestart=true
startsecs=0
priority=20
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:scheduler]
command=php artisan schedule:work --no-interaction
directory=/var/www/html
user=www-data
autostart=true
autorestart=true
startsecs=5
priority=30
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
