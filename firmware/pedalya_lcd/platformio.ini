; Pedalya on-board rental countdown display
; ESP32 + HD44780 16x2 LCD over I2C
;
; Build:   pio run
; Flash:   pio run -t upload
; Monitor: pio device monitor
;
; The sources live in the pedalya_lcd/ sketch folder so the Arduino IDE opens
; them directly, and PlatformIO builds the very same files from there.
;
; WiFi and API credentials come from pedalya_lcd/config.h. Override any of them
; from the command line instead of editing the file, e.g.
;   pio run -t upload --project-option="build_flags=-D WIFI_SSID=\\\"mynetwork\\\""

[platformio]
src_dir = pedalya_lcd
include_dir = pedalya_lcd

[env:esp32dev]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; build_flags can be passed via command line to override config.h/secrets.h if needed
build_flags =

lib_deps =
    bblanchon/ArduinoJson@^7.0.4
    marcoschwartz/LiquidCrystal_I2C@^1.1.0
    madhephaestus/ESP32Servo@^3.0.6
