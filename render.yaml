# Free-tier demo deployment. SQLite and uploads are ephemeral on Render's free
# instance; do not use this configuration for real rider data.
services:
  - type: web
    name: pedalya-demo
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /up
    autoDeployTrigger: commit
    envVars:
      - key: APP_NAME
        value: Pedalya
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_TIMEZONE
        value: Asia/Manila
      - key: APP_KEY
        generateValue: true
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: FILESYSTEM_DISK
        value: public
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /var/www/html/storage/pedalya.sqlite
      - key: DEVICE_API_KEY
        generateValue: true
      # Password for the shared demo admin/rider logins. Set it once in the
      # dashboard; docker/entrypoint.sh then recreates those logins on every
      # deploy, which the ephemeral SQLite file otherwise wipes. Leave it unset
      # and no demo accounts are created.
      - key: DEMO_ACCOUNT_PASSWORD
        sync: false
