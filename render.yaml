# Free-tier demo deployment. Render Free Postgres expires after 30 days, so
# this configuration is for testing and prototyping, not production rider data.
services:
  - type: web
    name: pedalya-demo
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /up
    autoDeployTrigger: commit
    envVars:
      - key: APP_NAME
        value: Pedalya
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_TIMEZONE
        value: Asia/Manila
      - key: APP_KEY
        generateValue: true
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: FILESYSTEM_DISK
        value: public
      - key: DB_CONNECTION
        value: pgsql
      # Set this to the database's Internal Database URL in the Render
      # dashboard. Keep the credential out of the Blueprint and source control.
      - key: DB_URL
        sync: false
      - key: DEVICE_API_KEY
        generateValue: true
      # Password for the shared demo admin/rider logins. Set it once in the
      # dashboard; docker/entrypoint.sh then recreates those logins on every
      # deploy, which the ephemeral SQLite file otherwise wipes. Leave it unset
      # and no demo accounts are created.
      - key: DEMO_ACCOUNT_PASSWORD
        sync: false
